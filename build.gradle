plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.transparenttelegram'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.transparenttelegram"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Classic Xposed API — LSPosed полностью поддерживает этот API.
    // compileOnly: сам jar на устройстве не нужен, его предоставляет фреймворк LSPosed.
    compileOnly 'de.robv.android.xposed:api:82'
}

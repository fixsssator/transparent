plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.transparenttelegram'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.transparenttelegram"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
